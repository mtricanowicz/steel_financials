name: Refresh data

# Quarterly refresh of the generated datasets and insights, followed by a
# redeploy. Runs after typical filing windows; adjust the cron as needed.
# Requires the same GCP/Firebase secrets as Deploy plus:
#   SEC_USER_AGENT  - contact string for SEC EDGAR requests
#   OPENAI_API_KEY  - key for insight summarization and embeddings
#   QUOTES_API_URL  - public URL of the deployed quotes-api (for web + Streamlit)
on:
  workflow_dispatch:
    inputs:
      steelmakers:
        description: "Space-separated steelmakers"
        required: false
        default: "NUE STLD CLF CMC"
      years:
        description: "Space-separated years, e.g. 2026 (defaults to latest completed period year)"
        required: false
        default: ""
      periods:
        description: "Space-separated periods, e.g. Q2 (defaults to latest completed period)"
        required: false
        default: ""
      sources:
        description: "Financial data sources"
        type: choice
        options:
          - auto
          - manual
          - both
        required: false
        default: auto
      overwrite:
        description: "Replace populated metrics for the selected reporting periods"
        type: boolean
        required: false
        default: false
      share_data:
        description: "Rebuild the full share repurchase and sale history"
        type: boolean
        required: false
        default: false
      generate_insights:
        description: "Generate filing insights"
        type: boolean
        required: false
        default: true
  schedule:
    # 06:00 UTC on the 15th day of Feb, May, Aug, Nov
    - cron: "0 6 15 2,8,11 *"
    - cron: "0 6 15 5 *"

permissions:
  contents: write
  id-token: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: steel-dashboard/core
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBEDDING_BACKEND: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Determine run parameters
        id: params
        env:
          INPUT_STEELMAKERS: ${{ inputs.steelmakers }}
          INPUT_YEARS: ${{ inputs.years }}
          INPUT_PERIODS: ${{ inputs.periods }}
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_OVERWRITE: ${{ inputs.overwrite }}
          INPUT_SHARE_DATA: ${{ inputs.share_data }}
          INPUT_GENERATE_INSIGHTS: ${{ inputs.generate_insights }}
        run: |
          month="$(date -u +%m)"
          year="$(date -u +%Y)"

          case "$month" in
            01|02|03)
              default_year="$((year - 1))"
              default_period="Q4 FY"
              ;;
            04|05|06)
              default_year="$year"
              default_period="Q1"
              ;;
            07|08|09)
              default_year="$year"
              default_period="Q2"
              ;;
            10|11|12)
              default_year="$year"
              default_period="Q3"
              ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            steelmakers_input="NUE STLD CLF CMC X ATI CRS"
            years_input="$default_year"
            periods_input="$default_period"
            source_mode="auto"
            overwrite="false"
            share_data="false"
            generate_insights="true"
          else
            steelmakers_input="${INPUT_STEELMAKERS:-NUE STLD CLF CMC X ATI CRS}"
            years_input="${INPUT_YEARS:-$default_year}"
            periods_input="${INPUT_PERIODS:-$default_period}"
            source_mode="${INPUT_SOURCES:-auto}"
            overwrite="${INPUT_OVERWRITE:-false}"
            share_data="${INPUT_SHARE_DATA:-false}"
            generate_insights="${INPUT_GENERATE_INSIGHTS:-true}"
          fi

          read -r -a steelmakers <<< "$steelmakers_input"
          read -r -a years <<< "$years_input"
          read -r -a periods <<< "$periods_input"

          if [ "${#steelmakers[@]}" -eq 0 ] || [ "${#years[@]}" -eq 0 ] || [ "${#periods[@]}" -eq 0 ]; then
            echo "Steelmakers, years, and periods must each contain at least one value" >&2
            exit 1
          fi
          for steelmaker in "${steelmakers[@]}"; do
            case "$steelmaker" in
              NUE|STLD|CLF|CMC|X|ATI|CRS) ;;
              *) echo "Unsupported steelmaker: $steelmaker" >&2; exit 1 ;;
            esac
          done
          for requested_year in "${years[@]}"; do
            if [[ ! "$requested_year" =~ ^[0-9]{4}$ ]]; then
              echo "Invalid reporting year: $requested_year" >&2
              exit 1
            fi
          done
          for period in "${periods[@]}"; do
            case "$period" in
              Q1|Q2|Q3|Q4|FY) ;;
              *) echo "Invalid reporting period: $period" >&2; exit 1 ;;
            esac
          done

          case "$source_mode" in
            auto) sources=(auto) ;;
            manual) sources=(manual) ;;
            both) sources=(auto manual) ;;
            *) echo "Invalid source selection: $source_mode" >&2; exit 1 ;;
          esac
          for boolean in "$overwrite" "$share_data" "$generate_insights"; do
            if [[ "$boolean" != true && "$boolean" != false ]]; then
              echo "Boolean workflow inputs must be true or false" >&2
              exit 1
            fi
          done

          echo "steelmakers=${steelmakers[*]}" >> "$GITHUB_OUTPUT"
          echo "years=${years[*]}" >> "$GITHUB_OUTPUT"
          echo "periods=${periods[*]}" >> "$GITHUB_OUTPUT"
          echo "sources=${sources[*]}" >> "$GITHUB_OUTPUT"
          echo "overwrite=$overwrite" >> "$GITHUB_OUTPUT"
          echo "share_data=$share_data" >> "$GITHUB_OUTPUT"
          echo "generate_insights=$generate_insights" >> "$GITHUB_OUTPUT"

          echo "Using steelmakers: ${steelmakers[*]}"
          echo "Using years: ${years[*]}"
          echo "Using periods: ${periods[*]}"
          echo "Using sources: ${sources[*]}"
      - name: Build financials and buybacks
        env:
          PARAM_STEELMAKERS: ${{ steps.params.outputs.steelmakers }}
          PARAM_YEARS: ${{ steps.params.outputs.years }}
          PARAM_PERIODS: ${{ steps.params.outputs.periods }}
          PARAM_SOURCES: ${{ steps.params.outputs.sources }}
          PARAM_OVERWRITE: ${{ steps.params.outputs.overwrite }}
          PARAM_SHARE_DATA: ${{ steps.params.outputs.share_data }}
        run: |
          read -r -a steelmakers <<< "$PARAM_STEELMAKERS"
          read -r -a years <<< "$PARAM_YEARS"
          read -r -a periods <<< "$PARAM_PERIODS"
          read -r -a sources <<< "$PARAM_SOURCES"
          args=(--steelmakers "${steelmakers[@]}" --years "${years[@]}" --periods "${periods[@]}" --sources "${sources[@]}")
          if [ "$PARAM_OVERWRITE" = "true" ]; then
            args+=(--overwrite)
          fi
          if [ "$PARAM_SHARE_DATA" = "true" ]; then
            args+=(--share-data)
          fi
          python -m scripts.build_data "${args[@]}"
      - name: Generate insights
        if: steps.params.outputs.generate_insights == 'true'
        env:
          PARAM_STEELMAKERS: ${{ steps.params.outputs.steelmakers }}
          PARAM_YEARS: ${{ steps.params.outputs.years }}
          PARAM_PERIODS: ${{ steps.params.outputs.periods }}
        run: |
          read -r -a steelmakers <<< "$PARAM_STEELMAKERS"
          read -r -a years <<< "$PARAM_YEARS"
          read -r -a periods <<< "$PARAM_PERIODS"
          python -m sec_pipeline.pipeline --steelmakers "${steelmakers[@]}" --years "${years[@]}" --periods "${periods[@]}"
      - name: Commit refreshed generated data
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ../data/generated/*.json

          if git diff --cached --quiet; then
            echo "No generated data changes to commit"
          else
            git commit -m "chore(data): refresh generated datasets [skip ci]"
            git push origin "$BRANCH_NAME"
          fi
      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: steel-dashboard/data/generated/*.json

  redeploy:
    needs: build-data
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: generated-data
          path: steel-dashboard/data/generated
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDP }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Rebuild and deploy Streamlit
        run: |
          gcloud builds submit steel-dashboard \
            --config steel-dashboard/deploy/cloudbuild.streamlit.yaml \
            --substitutions=SHORT_SHA="${{ github.sha }}",_QUOTES_API_URL="${{ secrets.QUOTES_API_URL }}",_GA_MEASUREMENT_ID="${{ vars.GA_MEASUREMENT_ID }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
      - name: Detect web lockfile
        id: webfiles
        run: |
          if [ -f "steel-dashboard/web/package-lock.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web deploy: steel-dashboard/web/package-lock.json not found"
          fi
      - uses: actions/setup-node@v4
        if: steps.webfiles.outputs.found == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: steel-dashboard/web/package-lock.json
      - name: Build static site
        if: steps.webfiles.outputs.found == 'true'
        working-directory: steel-dashboard/web
        env:
          NEXT_PUBLIC_QUOTES_API_URL: ${{ secrets.QUOTES_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Firebase Hosting
        if: steps.webfiles.outputs.found == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
          entryPoint: steel-dashboard
